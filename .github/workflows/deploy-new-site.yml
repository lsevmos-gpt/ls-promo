name: New Linea Sporta site — REG.RU FTPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = verify FTP without writing; deploy = publish site'
        required: true
        type: choice
        options:
          - check
          - deploy
        default: check
      confirm_domain:
        description: 'For deploy, type new.liniyasporta.ru exactly'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/trigger-new-site-ftps-check.txt'
      - 'new-site/**'
      - '.github/workflows/deploy-new-site.yml'
permissions:
  contents: read

concurrency:
  group: linea-sporta-new-site-ftps
  cancel-in-progress: false

jobs:
  ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      REG_HOST: server169.hosting.reg.ru
      REG_USER: u3652448_new
      REG_PATH: /
      PUBLIC_DOMAIN: new.liniyasporta.ru
      REG_PASSWORD: ${{ secrets.NEW_SITE_FTP_PASSWORD }}
      MODE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[deploy-new-site]') && 'deploy' || 'check') || inputs.mode }}
      CONFIRM_DOMAIN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-new-site]') && 'new.liniyasporta.ru' || inputs.confirm_domain }}
      PATCH_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[patch-new-site]') && 'true' || 'false' }}
      PATCH_BASE_SHA: ${{ github.event.before }}

    steps:
      - name: Check out website files
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate repository, connection settings and confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'lsevmos-gpt/ls-promo' ]]; then
            echo '::error::This workflow is scoped to the designated website repository.'
            exit 1
          fi
          for name in REG_HOST REG_USER REG_PATH PUBLIC_DOMAIN REG_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable/secret for ${name}."
              exit 1
            fi
          done
          if [[ ! "$REG_HOST" =~ ^[A-Za-z0-9.-]+$ || ! "$REG_USER" =~ ^[A-Za-z0-9._-]+$ || "$REG_PATH" != "/" || ! "$PUBLIC_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo '::error::Invalid connection setting; refusing to pass untrusted values to FTP commands.'
            exit 1
          fi
          if [[ "$REG_PASSWORD" == *$'\n'* || "$REG_PASSWORD" == *$'\r'* ]]; then
            echo '::error::FTP secret contains newline or carriage-return characters. Use a single-line FTP password.'
            exit 1
          fi
          case "$MODE" in
            check) echo 'Read-only connection check selected.' ;;
            deploy)
              if [[ "$CONFIRM_DOMAIN" != "$PUBLIC_DOMAIN" ]]; then
                echo '::error::confirm_domain must be new.liniyasporta.ru.'
                exit 1
              fi
              if [[ ! -s new-site/index.html ]]; then
                echo '::error::Missing new-site/index.html. No files were uploaded.'
                exit 1
              fi
              ;;
            *) echo '::error::Unsupported mode.'; exit 1 ;;
          esac

      - name: Install FTPS client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -qq -y lftp

      - name: Verify FTPS login and inspect remote folder (read-only)
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$REG_USER","$REG_PASSWORD" "ftp://$REG_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            pwd;
            cls -1;
            bye
          "
          echo 'FTPS login and remote directory check successful; no writes performed.'

      - name: Verify domain-specific marker before any publishing
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$REG_USER","$REG_PASSWORD" "ftp://$REG_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            get .new-site-root.txt -o /tmp/new-site-root.txt;
            bye
          "
          if [[ "$(tr -d '\r\n' < /tmp/new-site-root.txt)" != "$PUBLIC_DOMAIN" ]]; then
            echo '::error::Remote marker mismatch. Refusing to touch this FTP directory.'
            exit 1
          fi

      - name: Prepare bounded text update
        if: env.MODE == 'deploy' && env.PATCH_MODE == 'true'
        run: python3 .github/scripts/new-site-text-patch.py prepare

      - name: Back up existing public files before first write
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _new_site_remote_backup
          BACKUP_ACTION="mirror --no-perms --verbose --exclude-glob '.*' --exclude-glob '*.php' --exclude-glob '*.sql' --exclude-glob '*.env' --exclude-glob '*.ini' --exclude-glob '*.log' --exclude-glob '*.pem' --exclude-glob '*.key' --exclude-glob '*config*' --exclude-glob '*.zip' --exclude-glob '*.tar' ./ _new_site_remote_backup/;"
          if [[ "$PATCH_MODE" == 'true' ]]; then
            BACKUP_ACTION='source _new_site_patch_backup.lftp;'
          fi
          lftp -u "$REG_USER","$REG_PASSWORD" "ftp://$REG_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            $BACKUP_ACTION
            bye
          "

      - name: Verify text backup matches the expected previous commit
        if: env.MODE == 'deploy' && env.PATCH_MODE == 'true'
        run: python3 .github/scripts/new-site-text-patch.py verify-backup

      - name: Save backup as a run artifact
        if: env.MODE == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: new-site-ftps-backup-${{ github.run_id }}
          path: _new_site_remote_backup/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7

      - name: Upload website files by FTPS (without deleting other files)
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          UPLOAD_ACTION="mirror -R --verbose --no-perms --exclude-glob '*.md' new-site/ ./;"
          if [[ "$PATCH_MODE" == 'true' ]]; then
            UPLOAD_ACTION='source _new_site_patch_upload.lftp;'
          fi
          lftp -u "$REG_USER","$REG_PASSWORD" "ftp://$REG_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            $UPLOAD_ACTION
            bye
          "

      - name: Verify live HTTPS homepage matches the uploaded file
        if: env.MODE == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 45 \
            "https://${PUBLIC_DOMAIN}/?deploy=${GITHUB_SHA}" \
            --output /tmp/new-site-live.html
          if ! cmp -s new-site/index.html /tmp/new-site-live.html; then
            echo '::error::The live HTTPS page does not match the deployed index.html.'
            exit 1
          fi
          echo 'New site uploaded and HTTPS homepage verified.'

      - name: Verify every updated text file over HTTPS
        if: env.MODE == 'deploy' && env.PATCH_MODE == 'true'
        run: python3 .github/scripts/new-site-text-patch.py verify-live

