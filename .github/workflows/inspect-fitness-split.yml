name: Inspect authentic aero-stretch split frame
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-fitness-split.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Inspect 12 genuine source frames
        shell: bash
        run: |
          set -euo pipefail
          video=new-site/assets/video/fitness-hero-0cfc68d445.mp4
          test -s "$video"
          ffmpeg -hide_banner -loglevel error -y -i "$video" -ss 0.65 -frames:v 1 -vf 'eq=brightness=0.012:contrast=1.025:saturation=1.035,unsharp=5:5:0.25:5:5:0.0' -q:v 3 /tmp/ls-final-aerostretch-frame.jpg
          python3 - <<'PY'
          import base64,hashlib
          from pathlib import Path
          p=Path('/tmp/ls-final-aerostretch-frame.jpg')
          data=base64.b64encode(p.read_bytes()).decode()
          print('FINAL_B64_BEGIN')
          for i in range(0,len(data),4000): print('FINAL_B64 '+data[i:i+4000])
          print('FINAL_B64_END')
          print('FINAL_BYTES',p.stat().st_size)
          print('FINAL_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aero-stretch-full-res-candidate
          path: /tmp/ls-final-aerostretch-frame.jpg
          retention-days: 1
