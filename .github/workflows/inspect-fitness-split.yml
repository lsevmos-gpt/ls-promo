name: Inspect authentic aero-stretch split frame
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-fitness-split.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Inspect 12 genuine source frames
        shell: bash
        run: |
          set -euo pipefail
          video=new-site/assets/video/fitness-hero-0cfc68d445.mp4
          test -s "$video"
          timecodes=(0.65 0.85 1.05 1.25 1.45 1.65 1.85 2.05 2.25 2.45 2.65 2.85)
          for i in "${!timecodes[@]}"; do
            tc="${timecodes[i]}"
            printf -v nn '%02d' "$i"
            echo "FRAME_INDEX=$i TIMECODE=$tc"
            ffmpeg -hide_banner -loglevel error -y -i "$video" -ss "$tc" -frames:v 1 -vf 'scale=480:270:flags=lanczos' -q:v 4 "/tmp/ls-split-$nn.jpg"
          done
          ffmpeg -hide_banner -loglevel error -y -framerate 1 -pattern_type glob -i '/tmp/ls-split-*.jpg' -vf 'tile=4x3' -frames:v 1 -q:v 8 /tmp/ls-split-contact-sheet.jpg
          python3 - <<'PY'
          import base64,hashlib
          from pathlib import Path
          p=Path('/tmp/ls-split-contact-sheet.jpg')
          data=base64.b64encode(p.read_bytes()).decode()
          print('SHEET_B64_BEGIN')
          for i in range(0,len(data),4000): print('SHEET_B64 '+data[i:i+4000])
          print('SHEET_B64_END')
          print('SHEET_BYTES',p.stat().st_size)
          print('SHEET_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aero-stretch-frame-selection
          path: /tmp/ls-split-contact-sheet.jpg
          retention-days: 1
