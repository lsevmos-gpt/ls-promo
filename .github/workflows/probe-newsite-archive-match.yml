name: Compare live site preview to site archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-newsite-archive-match.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare SHA-256 checksums (read only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat >/tmp/manifest <<'CHECKSUMS'
          8ab7c54853c17d409f1e24e79fea84fef26e24b604892e06b3f78778488893d7  index.html
          f53157788c94c30079d38ee669b2c39a4671475f80d2ada8678aab3642e541f0  fitness/index.html
          de1c18168f7eafb9947082d245423f317fd71070398ab178d8707b0a888db108  styles.css
          5ce1dd28447e9fe3c1a6669607b385f8111dce5061a75ff2424ca5b40e90516e  app.js
          66807f8bf87b85a9985c6c49e6c258cb4df33ffdda43341cc6dc7c651f576322  assets/content.js
          d62a4b11f09b0a72a0a7336c53811c050e1df29b1d2a99485e70c6e4dbd1f334  assets/brand/logo-dark.png
          79c1185fe78fbb8ca428338bd6a45929a0589337e8e2b8ee915499d0869185fb  assets/fitness/jumping-fitness.webp
          8f7286ec4df4e1a14355f8aa9493486ee5e555ee2975b7d43e30c932148a8adf  sitemap.xml
          3f87d52a026b886da004eb8cd119b374cf00ad2cfc69fc12b12c09561f74afd0  robots.txt
          d0f4b597210205532551f6a00bccf095d609c713df05158d426df53374a5f2ef  404.html
          b63be2cf1b800d394765310f6a5d0a89d21303a3ae90dd9e6fdc6d526fc05b0c  assets/fonts/fonts.css
          CHECKSUMS
          cd /tmp/probe
          while read -r SHA PATHPART; do
            mkdir -p "$(dirname "$PATHPART")"
            if [[ "$PATHPART" == "index.html" ]]; then URL="https://liniya-sporta-clubs.zippy-joy-1488.chatgpt.site/"; else URL="https://liniya-sporta-clubs.zippy-joy-1488.chatgpt.site/$PATHPART"; fi
            curl -fSL --retry 2 --connect-timeout 10 --max-time 35 "$URL" -o "$PATHPART"
            ACTUAL="$(sha256sum "$PATHPART" | cut -d' ' -f1)"
            echo "FILE=$PATHPART EXPECTED=$SHA ACTUAL=$ACTUAL BYTES=$(wc -c < "$PATHPART")"
            if [[ "$SHA" != "$ACTUAL" && "$PATHPART" == *.html ]]; then
              sed -i 's@https://liniya-sporta-clubs.zippy-joy-1488.chatgpt.site@https://new.liniyasporta.ru@g' "$PATHPART"
              NORMALIZED="$(sha256sum "$PATHPART" | cut -d' ' -f1)"
              echo "AFTER_HOST_REWRITE=$NORMALIZED"
            fi
          done </tmp/manifest
      - name: Analyze safe host and Cloudflare preview normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          d=Path('/tmp/probe')
          pre='https://liniya-sporta-clubs.zippy-joy-1488.chatgpt.site'
          target='https://new.liniyasporta.ru'
          expected={'index.html':'8ab7c54853c17d409f1e24e79fea84fef26e24b604892e06b3f78778488893d7','fitness/index.html':'f53157788c94c30079d38ee669b2c39a4671475f80d2ada8678aab3642e541f0','robots.txt':'3f87d52a026b886da004eb8cd119b374cf00ad2cfc69fc12b12c09561f74afd0','sitemap.xml':'8f7286ec4df4e1a14355f8aa9493486ee5e555ee2975b7d43e30c932148a8adf','assets/fonts/fonts.css':'b63be2cf1b800d394765310f6a5d0a89d21303a3ae90dd9e6fdc6d526fc05b0c'}
          for name,goal in expected.items():
            p=d/name
            s=p.read_text()
            s=s.replace(pre,target)
            if name.endswith('.html'):
              s,n=re.subn(r'<script>\(function\(\)\{function c\(\).*?</script>(?=</body></html>)','',s,flags=re.S)
              print('REMOVED_CF_SCRIPTS',name,n)
              if '<meta name="robots"' not in s:
                s=s.replace('<meta name="theme-color" content="#0A1E1E">','<meta name="theme-color" content="#0A1E1E"><meta name="robots" content="noindex,nofollow,noarchive">')
              s=s.replace('font-4.ttf" as="font" type="font/ttf"','font-4.woff2" as="font" type="font/woff2"')
            if name.endswith('fonts.css'):
              print('ORIGINAL_FONT_CSS',repr(s))
              s=s.replace("url(/assets/fonts/font-4.ttf) format('truetype')","url(/assets/fonts/font-4.woff2) format('woff2')")
              s=s.replace("url(/assets/fonts/font-2.ttf) format('truetype')","url(/assets/fonts/font-2.woff2) format('woff2')")
              s=s.replace("url(/assets/fonts/font-3.ttf) format('truetype')","url(/assets/fonts/font-3.woff2) format('woff2')")
            actual=hashlib.sha256(s.encode()).hexdigest()
            print('NORMALIZED',name,'MATCH',goal==actual,'SHA',actual,'SIZE',len(s.encode()))
          PY
      - name: Verify full normalization for source transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,hashlib
          from pathlib import Path
          d=Path('/tmp/probe')
          pre='https://liniya-sporta-clubs.zippy-joy-1488.chatgpt.site'
          target='https://new.liniyasporta.ru'
          expected={'index.html':'8ab7c54853c17d409f1e24e79fea84fef26e24b604892e06b3f78778488893d7','fitness/index.html':'f53157788c94c30079d38ee669b2c39a4671475f80d2ada8678aab3642e541f0','robots.txt':'3f87d52a026b886da004eb8cd119b374cf00ad2cfc69fc12b12c09561f74afd0','sitemap.xml':'8f7286ec4df4e1a14355f8aa9493486ee5e555ee2975b7d43e30c932148a8adf','assets/fonts/fonts.css':'b63be2cf1b800d394765310f6a5d0a89d21303a3ae90dd9e6fdc6d526fc05b0c'}
          for name,goal in expected.items():
           s=(d/name).read_text().replace(pre,target)
           if name.endswith('.html'):
            s=re.sub(r'<script>\(function\(\)\{function c\(\).*?</script>(?=</body></html>)','',s,flags=re.S)
            if '<meta name="robots"' not in s:
             s=re.sub(r'(<meta name="theme-color" content="[^"]*">)',r'\1<meta name="robots" content="noindex,nofollow,noarchive">',s,count=1)
            s=s.replace('font-4.ttf" as="font" type="font/ttf"','font-4.woff2" as="font" type="font/woff2"')
           if name.endswith('fonts.css'):
            s=re.sub(r"url\(/assets/fonts/font-(\d+)\.ttf\) format\('truetype'\)",r"url(/assets/fonts/font-\1.woff2) format('woff2')",s)
           actual=hashlib.sha256(s.encode()).hexdigest()
           print('COMPARE_FINAL',name,'MATCH',goal==actual,'SHA',actual,'SIZE',len(s.encode()))
           if name=='robots.txt':print('ROBOTS_REPR',repr(s))
          PY
