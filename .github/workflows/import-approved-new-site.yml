name: Import approved Linea Sporta new website (source only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-approved-new-site.yml"]
permissions:
  contents: write
concurrency:
  group: approved-new-site-import
  cancel-in-progress: false
jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-newsite-20261028]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out designated repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic webfont converter
        run: python -m pip install --quiet fonttools brotli
      - name: Recover public snapshot and validate approved ZIP fingerprint
        run: python .github/scripts/import-approved-new-site.py
      - name: Validate JavaScript and required pages
        shell: bash
        run: |
          set -euo pipefail
          node --check new-site/app.js
          test -s new-site/index.html
          test -s new-site/fitness/index.html
          test -s new-site/assets/fitness/jumping-fitness.webp
          test -s new-site/assets/video/club-heroes6d.mp4
          test -s new-site/.htaccess
          echo "Source-only import validated; no REG.RU FTP files changed."
      - name: Commit full site snapshot to new-site only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- new-site
          if git diff --cached --quiet; then
            echo "Approved site files already staged; no changes."
          else
            git commit -m "Import approved 32-page new.liniyasporta.ru site snapshot"
            git push origin HEAD:main
          fi
# Verified archived-site fingerprint correction; source-only import.
