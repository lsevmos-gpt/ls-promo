name: Inspect fitness upright aerial split frames
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-fitness-posture.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render two real upright frame candidates with natural restoration
        shell: bash
        run: |
          set -euo pipefail
          video='new-site/assets/video/fitness-hero-0cfc68d445.mp4'
          test -s "$video"
          for pair in 'A 2.06' 'B 0.80'; do
            set -- $pair
            id="$1"; tc="$2"
            ffmpeg -hide_banner -loglevel error -y -i "$video" -ss "$tc" -frames:v 1 -vf "hqdn3d=1.1:1.1:2.8:2.8,curves=all='0/0 0.12/0.15 0.43/0.47 0.80/0.82 1/1',eq=contrast=1.035:saturation=1.075,unsharp=5:5:0.66:5:5:0.0" -q:v 2 "/tmp/fitness-upright-$id.jpg"
          done
          python3 - <<'PY'
          import base64,hashlib
          from pathlib import Path
          for k in ('A','B'):
            p=Path(f'/tmp/fitness-upright-{k}.jpg')
            raw=p.read_bytes();b=base64.b64encode(raw).decode('ascii')
            print(f'UPRIGHT_{k}_BEGIN')
            for i in range(0,len(b),4000): print(f'UPRIGHT_{k}_B64 '+b[i:i+4000])
            print(f'UPRIGHT_{k}_END')
            print(f'UPRIGHT_{k}_BYTES',len(raw))
            print(f'UPRIGHT_{k}_SHA256',hashlib.sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: restored-upright-aerostretch-candidates
          path: /tmp/fitness-upright-*.jpg
          retention-days: 1
