name: Bar | REG.RU FTPS — guarded manual deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read-only preparation; deploy = upload after confirmation'
        type: choice
        required: true
        options:
          - plan
          - deploy
        default: plan
      confirm_domain:
        description: 'For deploy, type bar.liniyasporta.ru exactly'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: liniyasporta-bar-production
  cancel-in-progress: false

jobs:
  bar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FTP_HOST: server169.hosting.reg.ru
      FTP_USER: u3652448_bar
      FTP_PASSWORD: ${{ secrets.BAR_REG_PASSWORD }}
      FTP_ROOT: /
      EXPECTED_DOMAIN: bar.liniyasporta.ru
      MODE: ${{ inputs.mode }}
      CONFIRM_DOMAIN: ${{ inputs.confirm_domain }}

    steps:
      - name: Check out bar website files
        uses: actions/checkout@v4

      - name: Validate deployment settings and site content
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lsevmos-gpt/ls-promo"
          test "$FTP_HOST" = "server169.hosting.reg.ru"
          test "$FTP_USER" = "u3652448_bar"
          test "$FTP_ROOT" = "/"
          test "$EXPECTED_DOMAIN" = "bar.liniyasporta.ru"
          if [[ -z "$FTP_PASSWORD" ]]; then
            echo '::error::BAR_REG_PASSWORD is missing. Set the secret in repository Actions settings.'
            exit 1
          fi
          if [[ "$FTP_PASSWORD" == *$'\n'* || "$FTP_PASSWORD" == *$'\r'* ]]; then
            echo '::error::The FTP secret contains a line break.'
            exit 1
          fi
          if [[ ! -s bar-site/index.html ]]; then
            echo '::error::bar-site/index.html is absent; publish a real menu site source first.'
            exit 1
          fi
          case "$MODE" in
            plan) echo 'PLAN_ONLY=selected';;
            deploy)
              if [[ "$CONFIRM_DOMAIN" != "$EXPECTED_DOMAIN" ]]; then
                echo '::error::Exact domain confirmation is required for publishing.'
                exit 1
              fi;;
            *) echo '::error::Unsupported mode.'; exit 1;;
          esac
          echo 'Target: dedicated bar FTPS user and root /. No remote deletion is configured.'

      - name: Install FTPS client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -qq -y lftp

      - name: Verify bar login and inspect target root (read-only)
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            pwd;
            cls -1 -a;
            bye
          "
          echo 'BAR_FTPS_CONNECT=success'

      - name: Show prospective site files (plan mode, no writes)
        if: inputs.mode == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          find bar-site -type f | sort
          echo 'PLAN_ONLY=complete; no remote files changed'

      - name: Prove destination ownership before first write
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _bar_remote_backup
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            cls -1 -a;
            bye
          " > _bar_remote_backup/remote-listing.txt
          if lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 1;
            set net:timeout 20;
            cd /;
            get .bar-site-root.txt -o /tmp/existing-bar-site-root.txt;
            bye
          "; then
            [[ "$(tr -d '\r\n' < /tmp/existing-bar-site-root.txt)" == "$EXPECTED_DOMAIN" ]] || {
              echo '::error::Wrong site root marker; refusing to publish.'; exit 1;
            }
            echo 'DOMAIN_BINDING=verified_by_existing_marker'
          else
            echo 'No marker found. For first publication, verify live index is identical to the dedicated FTP index.'
            lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
              set cmd:fail-exit true;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ftp:passive-mode true;
              set ssl:verify-certificate true;
              set net:max-retries 1;
              set net:timeout 20;
              cd /;
              get index.html -o /tmp/bar-existing-ftp-index.html;
              bye
            " || { echo '::error::No remote index or marker; first establish domain binding.'; exit 1; }
            curl -fLsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache'               "https://$EXPECTED_DOMAIN/?before=${{ github.run_id }}" -o /tmp/bar-existing-https-index.html
            cmp -s /tmp/bar-existing-ftp-index.html /tmp/bar-existing-https-index.html || {
              echo '::error::Remote FTP directory does not match live bar domain; refusing to publish.'
              exit 1
            }
            echo 'DOMAIN_BINDING=verified_by_exact_HTTPS_FTP_match'
          fi

      - name: Back up public files before upload (read-only on REG.RU)
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            cd /;
            mirror --no-perms --verbose --exclude-glob '.*' --exclude-glob '*.php' --exclude-glob '*.sql' --exclude-glob '*.env' --exclude-glob '*.ini' --exclude-glob '*.log' --exclude-glob '*.pem' --exclude-glob '*.key' --exclude-glob '*config*' --exclude-glob '*.zip' --exclude-glob '*.tar' ./ _bar_remote_backup/public/;
            bye
          "
          echo 'REMOTE_BACKUP_READY=yes'

      - name: Save backup as GitHub Actions artifact
        if: inputs.mode == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: bar-predeploy-backup-${{ github.run_id }}
          path: _bar_remote_backup/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload bar site only (without deleting other files)
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_DOMAIN" > /tmp/bar-site-root.txt
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            cd /;
            mirror -R --no-perms --verbose --exclude-glob '*.md' bar-site/ ./;
            put /tmp/bar-site-root.txt -o .bar-site-root.txt;
            bye
          "
          echo 'BAR_DEPLOY_FILES_UPLOADED=yes (no deletion commands)'

      - name: Verify live bar homepage matches uploaded HTML
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 40             -H 'Cache-Control: no-cache' "https://$EXPECTED_DOMAIN/?deploy=${{ github.sha }}"             -o /tmp/bar-live.html
          cmp -s bar-site/index.html /tmp/bar-live.html || {
            echo '::error::Live homepage differs from uploaded index.html.'
            exit 1
          }
          echo 'BAR_HTTPS_HOMEPAGE=verified_exact_bytes'
