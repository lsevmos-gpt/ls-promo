name: Inspect real fitness hero video frames
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-fitness-frames.yml']
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install video decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract frame contact sheet from existing original video (no generation)
        shell: bash
        run: |
          set -euo pipefail
          test -s new-site/assets/video/fitness-hero-0cfc68d445.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 6.0 -i new-site/assets/video/fitness-hero-0cfc68d445.mp4 -vf 'eq=brightness=0.014:contrast=1.04:saturation=1.04,unsharp=5:5:0.4:5:5:0.0' -frames:v 1 -q:v 3 /tmp/fitness-selected-frame.jpg
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('/tmp/fitness-selected-frame.jpg')
          data=base64.b64encode(p.read_bytes()).decode()
          print('FRAME_B64_BEGIN')
          for i in range(0,len(data),4000):print('FRAME_B64 '+data[i:i+4000])
          print('FRAME_B64_END')
          print('FRAME_BYTES',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-hero-candidate-frame
          path: /tmp/fitness-selected-frame.jpg
          retention-days: 1
