name: Deploy promo.liniyasporta.ru to REG.RU

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'promo-site/**'

permissions:
  contents: read

concurrency:
  group: promo-liniyasporta-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          test -f promo-site/index.html
          test -f promo-site/graphite-start/index.html
          test -f promo-site/graphite-start/rules/index.html

      - name: Install FTPS tools
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy by FTPS
        env:
          PROMO_REG_PASSWORD: ${{ secrets.PROMO_REG_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROMO_REG_PASSWORD"

          lftp -u "u3652448_promo","$PROMO_REG_PASSWORD" "ftp://server169.hosting.reg.ru:21" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            cd /;
            mirror -R --verbose --exclude-glob .git* --exclude-glob .github* promo-site/ ./;
            bye
          "

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 10 --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "https://promo.liniyasporta.ru/graphite-start/?smoke=${GITHUB_SHA}" \
              -o /tmp/live.html; then
              break
            fi
            [ "$attempt" -eq 6 ] && exit 1
            sleep 5
          done
          grep -Fqi 'Графитовый старт' /tmp/live.html
          echo "Live promo site verified."
